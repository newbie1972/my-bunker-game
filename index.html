<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>나의 벙커 (My Bunker) - Optimization Fixed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #fff; overscroll-behavior: none; }
    #game-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* 렌즈 비네팅 효과 */
    #vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 120%); pointer-events: none; z-index: 5; }

    /* Crosshair */
    #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin-top: -3px; margin-left: -3px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; pointer-events: none; z-index: 10; box-shadow: 0 0 4px #000; }

    /* Compass UI */
    #compass-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 15, 0.8); border: 1px solid #444; border-radius: 20px; padding: 6px 20px; font-size: 12px; font-weight: bold; color: #e67e22; z-index: 15; text-align: center; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5); backdrop-filter: blur(4px); text-transform: uppercase; letter-spacing: 1px; }

    /* SVG 공통 클래스 */
    .icon-inline { width: 1.2em; height: 1.2em; vertical-align: -0.2em; fill: currentColor; }
    .icon-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* HUD */
    #hud { position: absolute; top: 55px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
    .hud-card { background: linear-gradient(135deg, rgba(20,20,20,0.9), rgba(10,10,10,0.9)); border: 1px solid #333; border-radius: 8px; padding: 12px 16px; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); backdrop-filter: blur(2px); transition: 0.3s; color: #ddd; }
    .hp-bar-bg { width: 140px; height: 8px; background: #111; border-radius: 4px; overflow: hidden; margin-top: 6px; border: 1px solid #000; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8); }
    .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #c0392b, #e74c3c); transition: width 0.2s ease-out; }

    /* Boss HUD */
    #boss-hud { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 600px; display: none; z-index: 11; text-align: center; pointer-events: none; }
    #boss-name { font-size: 18px; font-weight: bold; color: #e74c3c; text-shadow: 0 2px 5px #000; margin-bottom: 6px; letter-spacing: 2px; }
    #boss-hp-bg { width: 100%; height: 16px; background: rgba(10,10,10,0.9); border: 2px solid #2c3e50; border-radius: 8px; overflow: hidden; box-shadow: 0 0 15px rgba(192,57,43,0.6); }
    #boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #8e44ad, #c0392b, #e74c3c); transition: width 0.1s; }

    /* Tool Slot Bar */
    #tool-bar { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; pointer-events: auto; }
    .tool-slot { width: 65px; height: 65px; background: rgba(15, 15, 15, 0.85); border: 2px solid #333; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 10px; font-weight: bold; color: #888; cursor: pointer; transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
    .tool-slot.active { border-color: #e67e22; background: rgba(40, 30, 10, 0.95); color: #fff; transform: translateY(-10px) scale(1.05); box-shadow: 0 8px 15px rgba(230,126,34,0.4); }
    .tool-slot.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }
    .tool-slot .icon { margin-bottom: 4px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8)); display: flex; justify-content: center; align-items: center; }
    .tool-slot .icon svg { width: 26px; height: 26px; fill: currentColor; }

    /* Visual Effects */
    #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, rgba(255,0,0,0.6) 100%); pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 9; mix-blend-mode: multiply; }
    #fade-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; pointer-events: none; opacity: 0; transition: opacity 2s; z-index: 40; }
    #toast { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 20, 0.95); border: 1px solid #e74c3c; color: #fff; padding: 10px 24px; border-radius: 4px; font-size: 13px; font-family: monospace; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 15; text-align: center; box-shadow: 0 4px 10px rgba(231,76,60,0.2); letter-spacing: 0.5px; text-transform: uppercase; }

    /* Modals */
    .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; text-align: center; padding: 20px; transition: opacity 1s; backdrop-filter: blur(5px); }
    .modal h1 { font-size: 50px; color: #e74c3c; margin-bottom: 10px; letter-spacing: 4px; line-height: 1.2; text-shadow: 0 4px 15px rgba(231,76,60,0.5); font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; }
    .modal h2 { font-size: 20px; color: #bdc3c7; margin-bottom: 30px; font-weight: normal; letter-spacing: 1px; }
    .modal p { color: #95a5a6; font-size: 15px; max-width: 500px; line-height: 1.8; margin-bottom: 40px; }
    .btn-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
    .platform-btn { background: #2c3e50; border: 2px solid #34495e; color: #ecf0f1; padding: 14px 28px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; min-width: 180px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .platform-btn:hover { background: #34495e; border-color: #e67e22; color: #e67e22; box-shadow: 0 0 15px rgba(230,126,34,0.3); }
    .hard-btn { background: #641E16; border-color: #922B21; color: #f5b7b1; }
    .hard-btn:hover { background: #7B241C; border-color: #E74C3C; color: #fff; box-shadow: 0 0 20px rgba(231,76,60,0.6); }

    /* Mobile Controls */
    #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 12; display: none; }
    #joystick-zone { position: absolute; bottom: 40px; left: 30px; width: 150px; height: 150px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 50%; pointer-events: auto; backdrop-filter: blur(2px); }
    #joystick-knob { position: absolute; top: 40px; left: 40px; width: 70px; height: 70px; background: rgba(230, 126, 34, 0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    #touch-look-zone { position: absolute; top: 80px; right: 0; width: 50%; height: calc(100% - 200px); pointer-events: auto; }
    .mobile-action-group { position: absolute; bottom: 40px; right: 30px; display: flex; flex-direction: column; gap: 20px; align-items: flex-end; pointer-events: auto; }
    .mobile-sub-group { display: flex; gap: 20px; align-items: flex-end; }
    .mobile-btn { background: rgba(20, 20, 20, 0.85); border: 2px solid #555; color: #ddd; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 16px rgba(0,0,0,0.7); backdrop-filter: blur(2px); transition: 0.1s; flex-direction: column; touch-action: none; }
    .mobile-btn svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .mobile-btn:active { transform: scale(0.9); background: rgba(230, 126, 34, 0.9); border-color: #f39c12; color: #fff; }
    .btn-fire { width: 95px; height: 95px; border-color: #c0392b; background: rgba(142, 68, 61, 0.8); }
    .btn-fire svg { width: 40px; height: 40px; }
    .btn-jump { width: 75px; height: 75px; border-color: #2980b9; }
    .btn-reload { width: 65px; height: 65px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- HTML Structure -->
  <div id="game-container"></div>
  <div id="vignette"></div>
  <div id="crosshair"></div>
  <div id="damage-flash"></div>
  <div id="fade-screen"></div>
  <div id="toast">MESSAGE</div>
  
  <div id="compass-container">AZIMUTH: <span id="compass-dir" style="color:#fff;">N</span></div>

  <div id="hud">
    <div class="hud-card" id="hud-hp">
      <div style="color:#e74c3c; font-weight:bold; display: flex; align-items: center; gap: 5px;">
        <svg class="icon-inline" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> 
        HP <span id="hp-num" style="color:#fff;">100</span>%
      </div>
      <div class="hp-bar-bg"><div id="hp-bar" class="hp-bar-fill"></div></div>
    </div>
    <div class="hud-card" id="hud-status" style="text-align: center; min-width: 160px;">
      <div id="time-display" style="font-size: 18px; color: #e67e22; font-weight: bold; font-family: monospace;">15:30:00</div>
      <div id="status-display" style="font-size: 11px; color: #7f8c8d; margin-top: 4px;">STANDBY</div>
      <div id="depth-display" style="font-size: 11px; color: #3498db; margin-top: 4px; font-family: monospace;">X: 0, Z: 0 | D: 0m</div>
    </div>
    <div class="hud-card" id="hud-ammo" style="text-align: right;">
      <div style="color:#95a5a6; font-weight:bold; display: flex; justify-content: flex-end; align-items: center; gap: 5px;">
        AMMO <svg class="icon-inline" style="width: 1em; height: 1em;" viewBox="0 0 24 24"><path d="M6 2v16c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V2H6zm6 16c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      </div>
      <div style="font-size: 18px; font-family: monospace; color: #fff; margin-top: 2px;"><span id="ammo-clip" style="color:#f1c40f;">12</span> <span style="font-size:12px;color:#777;">/</span> <span id="ammo-reserve" style="font-size:14px;">48</span></div>
    </div>
  </div>

  <div id="boss-hud">
    <div id="boss-name">STALIN</div>
    <div id="boss-hp-bg"><div id="boss-hp-fill"></div></div>
  </div>

  <!-- Tool Slot Bar -->
  <div id="tool-bar">
    <div class="tool-slot active" id="slot-1" onpointerdown="selectTool(1)">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M4 11v6a2 2 0 0 0 2 2h3.5l1.5-3H13v-3l-2-4H5a1 1 0 0 0-1 1z"/><path d="M11 6h8a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-8z"/></svg>
      </span>
      <span>LUGER</span>
    </div>
    <div class="tool-slot" id="slot-2" onpointerdown="selectTool(2)">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M18 10v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V7a2 2 0 0 1 4 0v3h1V6a2 2 0 0 1 4 0v4h1V8a2 2 0 0 1 4 0v2z"/></svg>
      </span>
      <span>FIST</span>
    </div>
    <div class="tool-slot" id="slot-3" onpointerdown="selectTool(3)">
      <span class="icon">
        <svg class="icon-stroke" viewBox="0 0 24 24"><path d="M14.531 12.469L3.5 23.5"/><path d="M18.8 8.169a10.985 10.985 0 0 0-3.3-3.669 2.5 2.5 0 0 0-3.5 3.5c1.458 1.034 2.659 2.378 3.5 3.5a2.5 2.5 0 0 0 3.3-3.331z"/></svg>
      </span>
      <span>PICKAXE</span>
    </div>
  </div>

  <!-- Modals -->
  <div id="start-modal" class="modal">
    <h1>MY BUNKER</h1>
    <h2>1945 BERLIN: THE LAST STAND</h2>
    <p>포화 속 무너져 내리는 지하 벙커.<br>절망적인 적의 공세 속에서 생존하고 모든 것의 흑막과 결투하십시오.</p>
    <div class="btn-group">
      <button class="platform-btn" onclick="startGame('PC', false)">
        <svg class="icon-inline icon-stroke" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> PC Normal
      </button>
      <button class="platform-btn" onclick="startGame('MOBILE', false)">
        <svg class="icon-inline icon-stroke" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg> Mobile Normal
      </button>
    </div>
    <div class="btn-group" style="margin-top: 10px;">
      <button class="platform-btn hard-btn" onclick="startGame('PC', true)">
        <svg class="icon-inline icon-stroke" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><path d="M8 20v2h8v-2"/><path d="M12.5 17h-1"/><path d="M16 20a4 4 0 0 0 4-4v-4a8 8 0 1 0-16 0v4a4 4 0 0 0 4 4"/></svg> PC HARD
      </button>
      <button class="platform-btn hard-btn" onclick="startGame('MOBILE', true)">
        <svg class="icon-inline icon-stroke" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><path d="M8 20v2h8v-2"/><path d="M12.5 17h-1"/><path d="M16 20a4 4 0 0 0 4-4v-4a8 8 0 1 0-16 0v4a4 4 0 0 0 4 4"/></svg> Mobile HARD
      </button>
    </div>
  </div>

  <div id="ending-modal" class="modal" style="display:none; z-index:60;">
    <h1 id="ending-title">전사 하였습니다</h1>
    <h2 id="ending-subtitle"></h2>
    <p id="ending-desc">00분 00초간 생존했습니다.</p>
    <button class="platform-btn" onclick="location.reload()" style="background:#2c3e50; border-color:#34495e;">다시 도전하기</button>
  </div>

  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="touch-look-zone"></div>
    <div class="mobile-action-group">
      <div class="mobile-sub-group">
        <button class="mobile-btn btn-reload" id="btn-reload" onpointerdown="triggerReload(event)">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
      <div class="mobile-sub-group">
        <button class="mobile-btn btn-jump" onpointerdown="triggerJump(event)">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <button class="mobile-btn btn-fire" onpointerdown="triggerPrimaryAction(event)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Game Script -->
  <script>
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function(e) { if(e.touches.length > 1) { e.preventDefault(); } }, { passive: false });

    /* =========================================================================
       AUDIO FX & BGM (브금 재생)
       ========================================================================= */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let bgmOsc = null;
    let bgmGain = null;
    let bgmInterval = null;

    function initAudio() { 
      if(!audioCtx) audioCtx = new AudioCtx(); 
      if(audioCtx.state==='suspended') audioCtx.resume(); 
      startBGM(); 
    }

    function startBGM() {
      if (bgmOsc) return; 
      bgmOsc = audioCtx.createOscillator();
      bgmGain = audioCtx.createGain();
      
      bgmOsc.type = 'sine'; 
      bgmOsc.frequency.value = 50; 
      bgmGain.gain.value = 0.4; 
      
      bgmOsc.connect(bgmGain);
      bgmGain.connect(audioCtx.destination);
      bgmOsc.start();

      let tick = 0;
      bgmInterval = setInterval(() => {
        if(gameState === 'ENDING') { stopBGM(); return; }
        let freqBase = gameState === 'BOSS' ? 70 : 50; 
        let beatPace = gameState === 'BOSS' ? 2 : 4;
        bgmOsc.frequency.setTargetAtTime(freqBase + (tick % beatPace === 0 ? 15 : 0), audioCtx.currentTime, 0.1);
        tick++;
      }, 500);
    }

    function stopBGM() {
      if (bgmInterval) clearInterval(bgmInterval);
      if (bgmOsc) {
        bgmGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        setTimeout(() => { bgmOsc.stop(); bgmOsc = null; }, 1000);
      }
    }

    const sfx = {
      playOsc(type, f1, f2, dur, vol) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(f1, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + dur);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur);
      },
      shoot() { this.playOsc('sawtooth', 400, 30, 0.15, 0.5); },
      punch() { this.playOsc('sine', 220, 60, 0.1, 0.4); },
      punchHit() { this.playOsc('square', 180, 50, 0.08, 0.6); },
      dig() { this.playOsc('triangle', 120, 40, 0.1, 0.4); },
      explosion() { this.playOsc('square', 80, 20, 0.6, 0.8); },
      bossHit() { this.playOsc('sawtooth', 80, 40, 0.3, 0.8); },
      reload() { this.playOsc('sine', 600, 900, 0.12, 0.2); }
    };

    /* =========================================================================
       GAME STATE & CONFIGURATION
       ========================================================================= */
    let platformMode = 'PC';
    let isGameStarted = false; 
    let isHardMode = false; 
    let gameState = 'START'; 
    let realTimeSeconds = 0;
    let inGameTimeSeconds = 0; 
    let nextAirRaidTime = 45; 
    let nextEnemySpawnTime = -1; 
    let isAirRaidActive = false; 

    const MAP_SIZE = 40;
    const MIN_DIG_Y = -30;
    let MAX_ENEMIES = 60; 
    const BOSS_START_TIME = 150; 

    const PUNCH_RANGE = 3.5; 
    const BOSS_PUNCH_RANGE = 4.0;

    let player = {
      hp: 100, maxHp: 100, pos: new THREE.Vector3(0, 1.5, 5), rotY: 0, rotX: 0,
      speed: 0.11, velocityY: 0, isGrounded: false, activeSlot: 1, ammoClip: 12, ammoReserve: 48,
      isReloading: false, lastDamageTime: 0, isMoving: false
    };

    let stalin = null;

    // 🌟 프레임 최적화: 매 프레임마다 쓰이는 임시 연산용 벡터들을 전역으로 빼서 메모리(GC) 렉 방지
    const _tempVec = new THREE.Vector3();
    const _moveVec = new THREE.Vector3();
    const _raycastP = new THREE.Vector3();
    const _eMuzzle = new THREE.Vector3();
    const _pCenter = new THREE.Vector3();
    const _rayDir = new THREE.Vector3();
    const _pushDir = new THREE.Vector3();

    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.06); 

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000); 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1.0); // 🌟 프레임 최적화: 모바일 고해상도 픽셀 과부하 차단 (1.0 고정)
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x444455, 0.8); 
    scene.add(ambientLight);
    
    const flashlight = new THREE.SpotLight(0xfff0dd, 2.5, 35, Math.PI / 4, 0.8, 1);
    camera.add(flashlight); flashlight.position.set(0.1, -0.2, 0.2); flashlight.target.position.set(0, 0, -1);
    flashlight.castShadow = true;
    flashlight.shadow.mapSize.width = 512; flashlight.shadow.mapSize.height = 512;
    flashlight.shadow.camera.near = 0.5; flashlight.shadow.camera.far = 30;
    camera.add(flashlight.target); scene.add(camera);

    /* =========================================================================
       OPTIMIZED BLOOD PARTICLES & HIT FEEDBACK (독립적 피격 효과 적용 완료)
       ========================================================================= */
    const bloodParticles = [];
    
    function createBloodHitEffect(pos) {
      const particleCount = 8;
      const geo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for(let i=0; i<particleCount*3; i++) posArray[i] = pos.toArray()[i%3];
      geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

    /* =========================================================================
       PBR TEXTURE GENERATOR
       ========================================================================= */
    function createRealisticTexture(baseColorHex, type) {
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = baseColorHex; ctx.fillRect(0, 0, 64, 64);
      
      const imgData = ctx.getImageData(0,0,64,64);
      const data = imgData.data;
      const intensity = type === 'metal' ? 60 : (type === 'dirt' ? 30 : 20);
      
      for(let i=0; i<data.length; i+=4) {
          const noise = (Math.random() - 0.5) * intensity;
          data[i] = Math.min(255, Math.max(0, data[i] + noise));
          data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
          data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      if (type === 'grid') { 
          ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
          ctx.strokeRect(0, 0, 64, 64);
      }

      const map = new THREE.CanvasTexture(cv);
      map.magFilter = THREE.NearestFilter; 
      
      return new THREE.MeshStandardMaterial({
          map: map,
          roughness: type === 'metal' ? 0.3 : (type === 'dirt' ? 1.0 : 0.8),
          metalness: type === 'metal' ? 0.8 : 0.05
      });
    }

    const materials = {

    /* =========================================================================
       OPTIMIZED VOXEL ENGINE
       ========================================================================= */
    const voxels = new Map();
    const voxelGroup = new THREE.Group(); scene.add(voxelGroup);
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);

    function getKey(x, y, z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }
    
    function hasAirNeighbor(x, y, z) {
      if (!voxels.has(getKey(x+1, y, z))) return true; if (!voxels.has(getKey(x-1, y, z))) return true;
      if (!voxels.has(getKey(x, y+1, z))) return true; if (!voxels.has(getKey(x, y-1, z))) return true;
      if (!voxels.has(getKey(x, y, z+1))) return true; if (!voxels.has(getKey(x, y, z-1))) return true;
      return false;
    }

    function addVoxelLogic(x, y, z, type, hp=3) {
      const key = getKey(x, y, z);
      if (voxels.has(key)) return;
      if (type === 'concrete' || type === 'bedrock') hp = 999;
      voxels.set(key, { x: Math.floor(x), y: Math.floor(y), z: Math.floor(z), type, hp, maxHp: hp, mesh: null, key: key });
    }

    function updateVoxelMesh(x, y, z) {
      const key = getKey(x, y, z); const v = voxels.get(key); if (!v) return;
      const exposed = hasAirNeighbor(v.x, v.y, v.z);
      if (exposed && !v.mesh) {
        v.mesh = new THREE.Mesh(boxGeo, materials[v.type]);
        v.mesh.position.set(v.x + 0.5, v.y + 0.5, v.z + 0.5);
        v.mesh.userData = { isVoxel: true, key: key, type: v.type, x: v.x, y: v.y, z: v.z }; 
        v.mesh.receiveShadow = true; 
        v.mesh.castShadow = false; // 🌟 프레임 최적화: 수천 개 블록의 그림자 '투사' 연산 제거
        voxelGroup.add(v.mesh);
      } else if (!exposed && v.mesh) {
        voxelGroup.remove(v.mesh); v.mesh = null;
      }
    }

    let isBatching = false; const dirtyVoxels = new Set();
    function updateVoxelMeshBatched(x, y, z) {
      if (isBatching) dirtyVoxels.add(getKey(x, y, z)); else updateVoxelMesh(x, y, z);
    }

    function removeVoxel(x, y, z, force = false) {
      const key = getKey(x, y, z); const v = voxels.get(key);
      if (!v || v.type === 'bedrock' || v.type === 'portal') return false; 
      if (!force && v.type === 'concrete') return false; 
      if (v.mesh) voxelGroup.remove(v.mesh); voxels.delete(key);
      updateVoxelMeshBatched(x+1, y, z); updateVoxelMeshBatched(x-1, y, z);
      updateVoxelMeshBatched(x, y+1, z); updateVoxelMeshBatched(x, y-1, z);
      updateVoxelMeshBatched(x, y, z+1); updateVoxelMeshBatched(x, y, z-1);
      return true;
    }

    function isSolid(x, y, z) { return voxels.has(getKey(x, y, z)); }

    function fastVoxelRaycast(origin, dir, maxDist) {
      let t = 0; const step = 0.2; 
      _raycastP.copy(origin);
      while (t <= maxDist) {
        const key = getKey(_raycastP.x, _raycastP.y, _raycastP.z); const v = voxels.get(key);
        if (v && v.type !== 'empty') return { distance: t, point: _raycastP.clone(), voxel: v };
        _raycastP.addScaledVector(dir, step); t += step;
      }
      return null;
    }

    /* =========================================================================
       WORLD GENERATOR
       ========================================================================= */
    function buildInitialWorld() {
      const halfSize = MAP_SIZE / 2;
      for (let x = -halfSize - 2; x <= halfSize + 2; x++) {
        for (let z = -halfSize - 2; z <= halfSize + 2; z++) {
          addVoxelLogic(x, MIN_DIG_Y, z, 'bedrock'); 
          const isBoundaryWall = (x <= -halfSize || x >= halfSize || z <= -halfSize || z >= halfSize);
          
          if (isBoundaryWall) {
            const isDoorOpening = ((x === -halfSize || x === halfSize) && Math.abs(z) <= 1) || ((z === -halfSize || z === halfSize) && Math.abs(x) <= 1);
            for (let y = MIN_DIG_Y + 1; y <= 4; y++) {
              if (z === -halfSize && Math.abs(x) <= 1 && y >= MIN_DIG_Y + 1 && y <= MIN_DIG_Y + 2) { addVoxelLogic(x, y, z, 'portal', 999); continue; }
              if (isDoorOpening && y >= 0 && y <= 3) {
                if (Math.abs(x) > halfSize || Math.abs(z) > halfSize) addVoxelLogic(x, y, z, 'concrete'); 
              } else addVoxelLogic(x, y, z, 'concrete');
            }
          } else {
            addVoxelLogic(x, 4, z, 'concrete'); 
            const isDoorway = Math.abs(x) <= 2 || Math.abs(z) <= 2;
            const isInteriorWall = (x % 10 === 0 || z % 10 === 0) && !isDoorway;
            for (let y = 0; y <= 3; y++) {
              if (y === 0) addVoxelLogic(x, y, z, 'dirt'); else if (isInteriorWall) addVoxelLogic(x, y, z, 'passage');
            }
            for (let y = -1; y > MIN_DIG_Y; y--) {
              if (z < -15 && x >= -1 && x <= 1 && y === MIN_DIG_Y + 1) continue; 
              if (x > 15 && z >= -2 && z <= 2 && y === -20) continue; 
              if (y < -10 && Math.random() < 0.25) addVoxelLogic(x, y, z, 'rock');
              else if (y === -12 && Math.abs(x) < 8 && Math.abs(z) < 8) addVoxelLogic(x, y, z, 'passage');
              else addVoxelLogic(x, y, z, 'dirt');
            }
          }
        }
      }
      
      addVoxelLogic(17, -20, 0, 'canvas', 1); 
      voxels.forEach(v => updateVoxelMesh(v.x, v.y, v.z));

      const artistLight = new THREE.PointLight(0xffdd55, 2.5, 12); artistLight.position.set(17, -20, 0); scene.add(artistLight);
      const argentinaLight = new THREE.PointLight(0x0088ff, 2.5, 12); argentinaLight.position.set(0, MIN_DIG_Y + 1.5, -19); scene.add(argentinaLight);

      const doorMat = createRealisticTexture('#6b1111', 'metal');
      const doorGeo = new THREE.BoxGeometry(4, 3.8, 0.3);
      const doors = [
          new THREE.Mesh(doorGeo, doorMat), new THREE.Mesh(doorGeo, doorMat),
          new THREE.Mesh(doorGeo, doorMat), new THREE.Mesh(doorGeo, doorMat)
      ];
      doors[0].position.set(0, 1.9, -19.85); doors[1].position.set(0, 1.9, 19.85);
      doors[2].position.set(19.85, 1.9, 0); doors[2].rotation.y = Math.PI/2;
      doors[3].position.set(-19.85, 1.9, 0); doors[3].rotation.y = Math.PI/2;
      doors.forEach(d => { d.castShadow = true; scene.add(d); });
    }

    function buildRuinsWorld() {

      const rig = createHumanoidEnemy();

    function updateEnemies() {
      if (!isGameStarted || gameState === 'START' || gameState === 'ENDING' || gameState === 'BOSS' || gameState === 'TRANSITION') return;
      const now = Date.now();
      
      const enemySpeed = isHardMode ? 0.35 : 0.035; 
      const shootCooldown = isHardMode ? 1 : 2200;  
      const enemyDamage = isHardMode ? 0.1 : 4;     
      const digCooldown = isHardMode ? 100 : 1200;

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i]; const ePos = e.group.position;
        if (!isSolid(ePos.x, ePos.y - 0.1, ePos.z)) { e.vy -= 0.015; e.isGrounded = false; } 
        else { e.vy = 0; ePos.y = Math.floor(ePos.y - 0.1) + 1.0; e.isGrounded = true; }
        ePos.y += e.vy;

        _tempVec.subVectors(player.pos, ePos); _tempVec.y = 0; const dist = _tempVec.length();
        if (dist > 2.0 && dist < 30) { 
          _tempVec.normalize().multiplyScalar(enemySpeed);
          const nextX = ePos.x + _tempVec.x; const nextZ = ePos.z + _tempVec.z;
          let blocked = false;
          let headHit = isSolid(nextX, ePos.y + 1.2, nextZ); let footHit = isSolid(nextX, ePos.y + 0.2, nextZ);

          if (e.isGrounded && player.pos.y < ePos.y - 0.5 && dist < 6.0) {
              blocked = true;
              if (now - e.lastDig > digCooldown) {
                  e.lastDig = now;
                  let v = voxels.get(getKey(ePos.x, ePos.y - 1.0, ePos.z)); 
                  if (v && v.type !== 'bedrock' && v.type !== 'portal') {
                      v.hp -= (isHardMode ? 999 : 1); sfx.dig(); if (v.hp <= 0) removeVoxel(v.x, v.y, v.z);
                  }
              }
          }
          else if (headHit || footHit) {
            blocked = true;
            if (e.isGrounded) { e.vy = 0.25; e.isGrounded = false; } 
            if (now - e.lastDig > digCooldown) {
              e.lastDig = now; let targetY = headHit ? (ePos.y + 1.2) : (ePos.y + 0.2);
              let v = voxels.get(getKey(nextX, targetY, nextZ));
              if (v && v.type !== 'concrete' && v.type !== 'bedrock' && v.type !== 'portal') { 
                v.hp -= (isHardMode ? 999 : 1); sfx.dig(); if (v.hp <= 0) removeVoxel(v.x, v.y, v.z); 
              }
            }
          }
          
          if (!blocked) {
            if (!isSolid(nextX, ePos.y + 0.5, ePos.z)) ePos.x = nextX;
            if (!isSolid(ePos.x, ePos.y + 0.5, nextZ)) ePos.z = nextZ;
            
            e.walkTime += (isHardMode ? 0.5 : 0.1);
            e.rig.armL.rotation.x = Math.sin(e.walkTime) * 0.8; e.rig.armR.rotation.x = -Math.sin(e.walkTime) * 0.8;
            e.rig.legL.rotation.x = -Math.sin(e.walkTime) * 0.8; e.rig.legR.rotation.x = Math.sin(e.walkTime) * 0.8;
          }
          e.group.lookAt(player.pos.x, ePos.y, player.pos.z);
        } else {
            e.rig.armL.rotation.x = 0; e.rig.armR.rotation.x = 0; e.rig.legL.rotation.x = 0; e.rig.legR.rotation.x = 0;
        }

        const true3DDist = ePos.distanceTo(player.pos);
        if (true3DDist < 25 && now - e.lastShoot > (isHardMode ? 1 : 2200 + Math.random()*500)) { 
          e.lastShoot = now;
          _eMuzzle.copy(ePos); _eMuzzle.y += 1.2; 
          _pCenter.copy(player.pos); _pCenter.y += 1.0; 
          _rayDir.subVectors(_pCenter, _eMuzzle).normalize();
          if (!fastVoxelRaycast(_eMuzzle, _rayDir, true3DDist)) { 
            damagePlayer(enemyDamage); 
            if (!isHardMode || Math.random() < 0.05) { 
                sfx.shoot();
                const tracer = new THREE.Line(new THREE.BufferGeometry().setFromPoints([_eMuzzle.clone(), _pCenter.clone()]), new THREE.LineBasicMaterial({color:0xffaa00}));
                scene.add(tracer); setTimeout(()=>scene.remove(tracer), 50);
            }
          }
        }
      }
    }

      const pipe = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.3), new THREE.MeshStandardMaterial({color:0x3e2723})); pipe.position.set(0.15, 2.0, 0.4);

    function equipStalinWeapons() {
        if(weaponsEquipped) return; weaponsEquipped = true;
        const metal = createRealisticTexture('#888', 'metal'); const wood = createRealisticTexture('#5c4033', 'wood');
        
        const hammerGroup = new THREE.Group();
        const hHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5), wood);
        const hHead = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.3), metal); hHead.position.set(0, 0.6, 0); 
        hammerGroup.add(hHandle); hammerGroup.add(hHead);
        hammerGroup.position.set(0, -0.4, 0.5); hammerGroup.rotation.x = Math.PI/2;
        stalin.rig.armR.add(hammerGroup);

        const sickleGroup = new THREE.Group();
        const sHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), wood);
        const sBlade = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.06, 8, 16, Math.PI*1.2), metal); sBlade.position.set(0, 0.5, -0.3); sBlade.rotation.y = Math.PI/2;
        sickleGroup.add(sHandle); sickleGroup.add(sBlade);
        sickleGroup.position.set(0, -0.4, 0.5); sickleGroup.rotation.x = Math.PI/2;

    }

    function updateStalin() {
      if (!isGameStarted || gameState !== 'BOSS' || !stalin) return;
      const now = Date.now(); const sPos = stalin.group.position;
      
      if (!isSolid(sPos.x, sPos.y - 0.1, sPos.z)) { stalin.vy -= 0.015; stalin.isGrounded = false; } 
      else { if (stalin.vy < 0) { stalin.vy = 0; sPos.y = Math.floor(sPos.y - 0.1) + 1.0; } stalin.isGrounded = true; }
      sPos.y += stalin.vy;

      _tempVec.subVectors(player.pos, sPos); _tempVec.y = 0; const dist = _tempVec.length();
      
      let currentPhase = stalin.phase;
      if (isHardMode) {
          if (stalin.hp <= stalin.maxHp * 0.75 && currentPhase === 1) stalin.phase = 2;
          if (stalin.hp <= stalin.maxHp * 0.50 && currentPhase === 2) stalin.phase = 3;
          if (stalin.hp <= stalin.maxHp * 0.25 && currentPhase === 3) stalin.phase = 4;
      } else {
          if (stalin.hp <= stalin.maxHp * 0.50 && currentPhase === 1) stalin.phase = 2;
      }

      if (currentPhase !== stalin.phase) {
          if (stalin.phase === 2) { showToast("[BOSS] 2페이즈: 광기 어린 독재자!"); document.getElementById('boss-name').innerText = "STALIN - 광기 어린 독재자"; document.getElementById('boss-name').style.color = "#ff00ff"; stalin.rig.torso.material.color.setHex(0x5a1111); stalin.rig.eyeL.visible=true; stalin.rig.eyeR.visible=true; }
          if (stalin.phase === 3) { showToast("[BOSS] 3페이즈: 피의 아우라! 속도와 데미지 상승!"); document.getElementById('boss-name').innerText = "STALIN - 피의 지배자"; }
          if (stalin.phase === 4) { showToast("[BOSS] 4페이즈: 망치와 낫! 즉사 주의!"); document.getElementById('boss-name').innerText = "STALIN - 소비에트의 망치와 낫"; equipStalinWeapons(); }
      }

      let speed = 0.04; let atkCooldown = 1500; let dmg = 20;
      if (isHardMode) {
          if (stalin.phase === 2) speed = 0.06;
          if (stalin.phase === 3) { speed = 0.08; atkCooldown = 800; dmg = 40; }
          if (stalin.phase === 4) { speed = 0.10; atkCooldown = 800; dmg = 90; }
      } else {
          if (stalin.phase === 2) { speed = 0.07; atkCooldown = 1000; }
      }

      if (dist > 1.5) {
        _tempVec.normalize().multiplyScalar(speed);
        const nextX = sPos.x + _tempVec.x; const nextZ = sPos.z + _tempVec.z;
        let blocked = false;
        if (isSolid(nextX, sPos.y + 1.2, nextZ) || isSolid(nextX, sPos.y + 0.2, nextZ)) blocked = true;
        
        if (blocked && stalin.isGrounded) { stalin.vy = 0.3; stalin.isGrounded = false; }
        
        if (!blocked) {
            if (!isSolid(nextX, sPos.y + 0.5, sPos.z)) sPos.x = nextX;
            if (!isSolid(sPos.x, sPos.y + 0.5, nextZ)) sPos.z = nextZ;
            stalin.walkTime += speed * 3;
            stalin.rig.armL.rotation.x = Math.sin(stalin.walkTime); stalin.rig.armR.rotation.x = -Math.sin(stalin.walkTime);
            stalin.rig.legL.rotation.x = -Math.sin(stalin.walkTime); stalin.rig.legR.rotation.x = Math.sin(stalin.walkTime);
        }
      } else {
          stalin.rig.armL.rotation.x = 0; stalin.rig.armR.rotation.x = 0; stalin.rig.legL.rotation.x = 0; stalin.rig.legR.rotation.x = 0;
      }
      stalin.group.lookAt(player.pos.x, sPos.y, player.pos.z);

      if (dist < 3.0 && now - stalin.lastAtk > atkCooldown) {
        stalin.lastAtk = now;
        stalin.rig.armR.rotation.x = -Math.PI/2; setTimeout(() => { if(stalin) stalin.rig.armR.rotation.x = 0; }, 200);

        if (stalin.phase >= 2 && Math.random() < 0.3) {
          sfx.explosion(); damagePlayer(15); showToast("[BOSS] 지면 강타!");
          const cx = Math.floor(sPos.x); const cz = Math.floor(sPos.z);
          for(let dx=-1; dx<=1; dx++) for(let dz=-1; dz<=1; dz++) removeVoxel(cx+dx, 0, cz+dz, true);
        } else {
          sfx.bossHit(); damagePlayer(dmg);
        }
        _pushDir.subVectors(player.pos, sPos).normalize().multiplyScalar(2.0);
        player.pos.x += _pushDir.x; player.pos.z += _pushDir.z;
      }
      
      document.getElementById('boss-hp-fill').style.width = `${(stalin.hp / stalin.maxHp) * 100}%`;
      if (stalin.hp <= 0) triggerEnding('VICTORY');
    }

    /* =========================================================================
       PLAYER PHYSICS & HEALING SYSTEM
       ========================================================================= */
    function triggerJump(e) { 
      if(e) e.preventDefault(); 
      if (!isGameStarted || gameState === 'START' || gameState === 'ENDING' || gameState === 'TRANSITION') return;
      if (player.isGrounded) { player.velocityY = 0.22; player.isGrounded = false; } 
    }

    function updatePlayer() {
      if (!isGameStarted || gameState === 'START' || gameState === 'ENDING' || gameState === 'TRANSITION') return;

      camera.quaternion.setFromEuler(new THREE.Euler(player.rotX, player.rotY, 0, 'YXZ'));
      _moveVec.set(0,0,0);

      if (platformMode === 'PC') {
        if (keys['KeyW']) _moveVec.z -= 1; if (keys['KeyS']) _moveVec.z += 1;
        if (keys['KeyA']) _moveVec.x -= 1; if (keys['KeyD']) _moveVec.x += 1;
        if (keys['Space']) triggerJump();
      } else {
        _moveVec.x = joystickDir.x; _moveVec.z = joystickDir.y;
      }

      player.isMoving = (_moveVec.lengthSq() > 0 || player.velocityY !== 0);

      if (_moveVec.lengthSq() > 0) {
        _moveVec.normalize().multiplyScalar(player.speed); _moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
        let nextX = player.pos.x + _moveVec.x; let nextZ = player.pos.z + _moveVec.z;
        
        const maxBound = MAP_SIZE / 2 - 1.5;
        nextX = Math.max(-maxBound, Math.min(maxBound, nextX)); nextZ = Math.max(-maxBound, Math.min(maxBound, nextZ));

        const checkSolid = (x, z) => isSolid(x, player.pos.y + 0.2, z) || isSolid(x, player.pos.y + 1.2, z);

        let canMoveX = true;
        if (_moveVec.x > 0 && checkSolid(nextX + 0.25, player.pos.z)) canMoveX = false;
        if (_moveVec.x < 0 && checkSolid(nextX - 0.25, player.pos.z)) canMoveX = false;
        if (canMoveX) player.pos.x = nextX;

        let canMoveZ = true;
        if (_moveVec.z > 0 && checkSolid(player.pos.x, nextZ + 0.25)) canMoveZ = false;
        if (_moveVec.z < 0 && checkSolid(player.pos.x, nextZ - 0.25)) canMoveZ = false;
        if (canMoveZ) player.pos.z = nextZ;
      }

      if (player.velocityY > 0) { if (isSolid(player.pos.x, player.pos.y + 1.8, player.pos.z)) { player.velocityY = 0; } }
      if (!isSolid(player.pos.x, player.pos.y - 0.05, player.pos.z)) { player.velocityY -= 0.015; player.isGrounded = false; } 
      else { if (player.velocityY < 0) { player.pos.y = Math.floor(player.pos.y - 0.05) + 1.0; player.velocityY = 0; player.isGrounded = true; } }
      
      if (player.pos.y < MIN_DIG_Y + 1.0) { player.pos.y = MIN_DIG_Y + 1.0; player.velocityY = 0; player.isGrounded = true; }
      player.pos.y += player.velocityY;
      camera.position.set(player.pos.x, player.pos.y + 1.5, player.pos.z);

      const lookDir = camera.getWorldDirection(new THREE.Vector3());
      const angle = Math.atan2(lookDir.x, -lookDir.z); 
      let dirText = "N";
      if (angle >= -Math.PI/8 && angle < Math.PI/8) dirText = "N";
      else if (angle >= Math.PI/8 && angle < 3*Math.PI/8) dirText = "NE";
      else if (angle >= 3*Math.PI/8 && angle < 5*Math.PI/8) dirText = "E";
      else if (angle >= 5*Math.PI/8 && angle < 7*Math.PI/8) dirText = "SE";
      else if (angle >= 7*Math.PI/8 || angle < -7*Math.PI/8) dirText = "S";
      else if (angle >= -7*Math.PI/8 && angle < -5*Math.PI/8) dirText = "SW";
      else if (angle >= -5*Math.PI/8 && angle < -3*Math.PI/8) dirText = "W";
      else if (angle >= -3*Math.PI/8 && angle < -Math.PI/8) dirText = "NW";
      document.getElementById('compass-dir').innerText = dirText;

      if (gameState === 'BUNKER') {
        if (player.pos.z < -19 && Math.abs(player.pos.x) < 2 && player.pos.y < -25) { triggerEnding('ARGENTINA'); }
      }

      if (gameState === 'BUNKER' || gameState === 'FINAL_WAVE') {
        const currentDepthMeter = Math.max(0, Math.floor((1.0 - player.pos.y) * 1.5));
        const px = Math.floor(player.pos.x); const pz = Math.floor(player.pos.z);
        const depthDisplayEl = document.getElementById('depth-display');

        if (player.pos.y <= -4) {
          depthDisplayEl.innerText = `X: ${px}, Z: ${pz} | D: -${currentDepthMeter}m [SAFE]`; depthDisplayEl.style.color = '#2ecc71';
          const targetLightIntensity = Math.max(0.1, 1.2 - (currentDepthMeter * 0.08));
          ambientLight.intensity = isAirRaidActive ? (Math.random() < 0.3 ? 0.05 : targetLightIntensity) : targetLightIntensity;
        } else {
          depthDisplayEl.innerText = `X: ${px}, Z: ${pz} | D: -${currentDepthMeter}m [DANGER]`; depthDisplayEl.style.color = '#e74c3c';
          ambientLight.intensity = isAirRaidActive ? (Math.random() < 0.3 ? 0.2 : 1.2) : 1.2;
        }
        if (isAirRaidActive && player.pos.y > -4 && realTimeSeconds % 1 === 0) damagePlayer(1); 
      }

      const hitWall = fastVoxelRaycast(camera.position, lookDir, 4.5);
      if (hitWall) { highlightBox.position.set(hitWall.voxel.x + 0.5, hitWall.voxel.y + 0.5, hitWall.voxel.z + 0.5); highlightBox.visible = true; } 
      else { highlightBox.visible = false; }
    }

    function createBulletTracer(fromPos, toPos) {
      const dist = fromPos.distanceTo(toPos);
      if(dist < 0.1) return;
      const geom = new THREE.CylinderGeometry(0.015, 0.015, dist, 4);
      geom.translate(0, dist/2, 0);
      const mat = new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 0.9});
      const cylinder = new THREE.Mesh(geom, mat);
      cylinder.position.copy(fromPos);
      cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), toPos.clone().sub(fromPos).normalize());
      scene.add(cylinder);
      setTimeout(() => { scene.remove(cylinder); geom.dispose(); mat.dispose(); }, 50);
    }

    let isPunching = false;
    function triggerPrimaryAction(e) {
      if(e) e.preventDefault();
      if (!isGameStarted || gameState === 'START' || gameState === 'ENDING' || gameState === 'TRANSITION') return;
      initAudio();

      const rayDir = camera.getWorldDirection(new THREE.Vector3());
      const rightVec = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      const downVec = new THREE.Vector3(0, -1, 0).applyQuaternion(camera.quaternion);
      const pMuzzlePos = camera.position.clone().add(rightVec.multiplyScalar(0.15)).add(downVec.multiplyScalar(0.15)).add(rayDir.clone().multiplyScalar(0.5));
      const hitWall = fastVoxelRaycast(camera.position, rayDir, 25);

      if (player.activeSlot === 1 && gameState !== 'BOSS') { 
        if (player.isReloading || player.ammoClip <= 0) { if(player.ammoClip<=0) triggerReload(); return; }
        player.ammoClip--; updateHUD(); sfx.shoot();
        pistolGroup.children[0].position.z = -0.10; setTimeout(() => pistolGroup.children[0].position.z = -0.15, 80); 
        
        const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(0, 0), camera);
        
        let closestTarget = null;
        let closestDist = hitWall ? hitWall.distance : 25;
        let hitType = hitWall ? 'wall' : 'none';

        const hitEnemies = ray.intersectObjects(enemyGroup.children, true); 
        if (hitEnemies.length > 0 && hitEnemies[0].distance < closestDist) {
            closestTarget = hitEnemies[0]; closestDist = hitEnemies[0].distance; hitType = 'enemy';
        }

        if (gameState === 'BOSS' && stalin) {
            const hitBoss = ray.intersectObjects(stalin.group.children, true);
            if (hitBoss.length > 0 && hitBoss[0].distance < closestDist) {
                closestTarget = hitBoss[0]; closestDist = hitBoss[0].distance; hitType = 'boss';
            }
        }

        if (hitType === 'enemy') {
          const hitObj = closestTarget.object; createBulletTracer(pMuzzlePos, closestTarget.point);
          const en = enemies.find(e => e.group === hitObj.userData.parent);
          if (en) {
            let dmg = 35; if (hitObj.userData.isHead) { dmg = 100; showToast("[CRITICAL] 헤드샷!"); }
            en.hp -= dmg; 
            createBloodHitEffect(closestTarget.point); flashEnemyColor(en.group.children); 
            if (en.hp <= 0) { enemyGroup.remove(en.group); enemies.splice(enemies.indexOf(en), 1); }
          }
        } else if (hitType === 'boss') {
          const hitObj = closestTarget.object; createBulletTracer(pMuzzlePos, closestTarget.point);
          let dmg = 35; if (hitObj.userData.isHead) { dmg = 100; showToast("[CRITICAL] 헤드샷!"); }
          stalin.hp -= dmg; 
          createBloodHitEffect(closestTarget.point); flashEnemyColor(stalin.group.children);
        } else if (hitType === 'wall') {
          createBulletTracer(pMuzzlePos, hitWall.point);
        } else {
          createBulletTracer(pMuzzlePos, pMuzzlePos.clone().add(rayDir.clone().multiplyScalar(25)));
        }
      } 
      else if (player.activeSlot === 2) { 
        if (isPunching) return;
        isPunching = true; sfx.punch();
        fistL.position.z = -0.5; setTimeout(() => { fistL.position.z = -0.25; }, 50);
        setTimeout(() => { fistR.position.z = -0.5; setTimeout(() => { fistR.position.z = -0.25; isPunching = false; }, 50); }, 75);

        const punchWall = fastVoxelRaycast(camera.position, rayDir, BOSS_PUNCH_RANGE);
        const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hitEnemies = ray.intersectObjects(enemyGroup.children, true); 
        
        if (gameState === 'BOSS' && stalin) {
           const hitsBoss = ray.intersectObjects(stalin.group.children, true);
           if (hitsBoss.length > 0 && hitsBoss[0].distance < BOSS_PUNCH_RANGE) {
             sfx.punchHit(); stalin.hp -= 50; player.hp = Math.min(player.maxHp, player.hp + 5); 
             createBloodHitEffect(hitsBoss[0].point); flashEnemyColor(stalin.group.children); updateHUD(); showToast("[HEAL] 체력 5% 회복!");
           }
        } 
        else if (hitEnemies.length > 0 && hitEnemies[0].distance < PUNCH_RANGE && (!punchWall || punchWall.distance > hitEnemies[0].distance)) { 
          const en = enemies.find(e => e.group === hitEnemies[0].object.userData.parent);
          if (en) {
            sfx.punchHit(); en.hp -= 50; 
            createBloodHitEffect(hitEnemies[0].point); flashEnemyColor(en.group.children);
            if (en.hp <= 0) { 
              enemyGroup.remove(en.group); enemies.splice(enemies.indexOf(en), 1); 
              player.hp = Math.min(player.maxHp, player.hp + 5); updateHUD(); showToast("[HEAL] 처치 피흡!");
            }
          }
        }

        if (gameState === 'BUNKER' && punchWall && punchWall.distance < 4.0) {
          if (punchWall.voxel.type === 'canvas') triggerEnding('ARTIST');
          if (punchWall.voxel.type === 'portal') triggerEnding('ARGENTINA');
        }
      }
      else if (player.activeSlot === 3 && gameState !== 'BOSS') { 
        const digWall = fastVoxelRaycast(camera.position, rayDir, 4.5);
        if (digWall) {
          const v = digWall.voxel;
          if (v.type === 'bedrock' || v.type === 'portal') { showToast("[SYSTEM] 절대 파괴 불가 지형"); return; }
          sfx.dig();
          v.hp -= isHardMode ? 999 : 1; 
          handToolGroup.rotation.x = -0.3; setTimeout(() => handToolGroup.rotation.x = 0, 100);
          if (v.hp <= 0) removeVoxel(v.x, v.y, v.z); else showToast(`[DIG] 파쇄 중... (${v.hp}/${v.maxHp})`);
        }
      }
    }

    /* =========================================================================
       SYSTEM HELPERS
       ========================================================================= */
    function damagePlayer(amt) {
      if (!isGameStarted || gameState === 'START' || gameState === 'ENDING' || gameState === 'TRANSITION') return;
      player.hp = Math.max(0, player.hp - amt); player.lastDamageTime = Date.now(); updateHUD();
      const f = document.getElementById('damage-flash'); f.style.opacity = '1'; setTimeout(() => f.style.opacity = '0', 200);
      if (player.hp <= 0) { if (gameState === 'BOSS') triggerEnding('DEFEAT'); else triggerEnding('DEATH'); }
    }

    function updateHUD() {
      document.getElementById('hp-num').innerText = Math.floor(player.hp); document.getElementById('hp-bar').style.width = `${player.hp}%`;
      document.getElementById('ammo-clip').innerText = player.ammoClip; document.getElementById('ammo-reserve').innerText = player.ammoReserve;
    }

    function showToast(msg) {
      const t = document.getElementById('toast'); t.innerText = msg;
      t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2000);
    }
    
    function selectTool(n) { 
      if(!isGameStarted || gameState === 'START' || gameState === 'BOSS' || gameState === 'ENDING') return; 
      player.activeSlot = n; document.querySelectorAll('.tool-slot').forEach(e=>e.classList.remove('active')); document.getElementById(`slot-${n}`).classList.add('active'); updateHandModel(); 
    }
    
    function triggerReload(e) {
      if(e) e.preventDefault();
      if (!isGameStarted || gameState === 'START' || gameState === 'BOSS' || player.isReloading || player.ammoClip === 12 || player.ammoReserve <= 0) return;
      player.isReloading = true; sfx.reload(); showToast("[SYSTEM] 장전 중...");
      setTimeout(() => {
        const amt = Math.min(12 - player.ammoClip, player.ammoReserve);
        player.ammoClip += amt; player.ammoReserve -= amt; player.isReloading = false; updateHUD();
      }, 1000);
    }

    const keys = {};
    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if(['Digit1','Digit2','Digit3'].includes(e.code)) selectTool(parseInt(e.key)); 
        if(e.code==='KeyR') triggerReload(); 
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    window.addEventListener('mousedown', e => { if(platformMode==='PC' && isGameStarted && e.button===0) triggerPrimaryAction(); });
    window.addEventListener('mousemove', e => {
      if (platformMode==='PC' && document.pointerLockElement === document.body && isGameStarted) {
        player.rotY -= e.movementX * 0.0025; player.rotX -= e.movementY * 0.0025; player.rotX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotX));
      }
    });

    let joystickActive = false, joyOrigin = {x:0,y:0}, joystickDir = {x:0,y:0};
    let joyTouchId = null;
    const joyZone = document.getElementById('joystick-zone'), joyKnob = document.getElementById('joystick-knob');
    
    joyZone.addEventListener('touchstart', e => { 
        if(!isGameStarted) return; 
        e.preventDefault();
        for(let i=0; i<e.changedTouches.length; i++) {
            if(joyTouchId === null) {
                joyTouchId = e.changedTouches[i].identifier;
                joystickActive = true; 
                const r = joyZone.getBoundingClientRect(); 
                joyOrigin = {x:r.left+r.width/2, y:r.top+r.height/2}; 
                break;
            }
        }
    }, { passive: false });

    joyZone.addEventListener('touchmove', e => {
      if(!joystickActive || !isGameStarted) return;
      e.preventDefault();
      for(let i=0; i<e.changedTouches.length; i++) {
          if(e.changedTouches[i].identifier === joyTouchId) {
              const dx = e.changedTouches[i].clientX - joyOrigin.x;
              const dy = e.changedTouches[i].clientY - joyOrigin.y;
              const dist = Math.min(Math.hypot(dx,dy),40);
              const ang = Math.atan2(dy,dx);
              joystickDir = {x: (Math.cos(ang)*dist)/40, y: (Math.sin(ang)*dist)/40}; 
              joyKnob.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
              break;
          }
      }
    }, { passive: false });

    const resetJoy = (e) => { 
        if(e) e.preventDefault();
        if(e) {
            let found = false;
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === joyTouchId) found = true;
            }
            if(!found) return; 
        }
        joystickActive = false; joyTouchId = null; joystickDir = {x:0,y:0}; joyKnob.style.transform = `translate(0,0)`; 
    };
    joyZone.addEventListener('touchend', resetJoy, { passive: false }); 
    joyZone.addEventListener('touchcancel', resetJoy, { passive: false });

    let lookTouchId=null, lx=0, ly=0;
    const lookZone = document.getElementById('touch-look-zone');
    
    lookZone.addEventListener('touchstart', e=>{ 
        if(!isGameStarted) return; 
        e.preventDefault();
        for(let i=0; i<e.changedTouches.length; i++) {
            if(lookTouchId === null) {
                lookTouchId=e.changedTouches[i].identifier; 
                lx=e.changedTouches[i].clientX; 
                ly=e.changedTouches[i].clientY; 
                break;
            }
        }
    }, { passive: false });

    lookZone.addEventListener('touchmove', e=>{
      if(!isGameStarted || lookTouchId === null) return;
      e.preventDefault();
      for(let t of e.changedTouches) { 
          if(t.identifier===lookTouchId) { 
              player.rotY -= (t.clientX-lx)*0.008; 
              player.rotX -= (t.clientY-ly)*0.008; 
              player.rotX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.rotX)); 
              lx=t.clientX; ly=t.clientY; 
              break;
          } 
      }
    }, { passive: false });

    const resetLook = (e) => {
        if(e) e.preventDefault();
        if(e) {
            let found = false;
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === lookTouchId) found = true;
            }
            if(!found) return; 
        }
        lookTouchId = null;
    };
    lookZone.addEventListener('touchend', resetLook, { passive: false });
    lookZone.addEventListener('touchcancel', resetLook, { passive: false });

    const actionButtons = document.querySelectorAll('.mobile-btn');
    actionButtons.forEach(btn => {
        btn.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: false });
        btn.addEventListener('touchmove', (e) => { e.stopPropagation(); }, { passive: false });
        btn.addEventListener('touchend', (e) => { e.stopPropagation(); }, { passive: false });
    });

    /* =========================================================================
       GAME FLOW & AIR RAIDS
       ========================================================================= */
    const explGeo = new THREE.SphereGeometry(2.5, 8, 8); 
    
    function startGame(mode, hard) {
      platformMode = mode; isHardMode = hard;
      initAudio(); document.getElementById('start-modal').style.display = 'none'; 
      
      if(isHardMode) { MAX_ENEMIES = 150; showToast("[SYSTEM] 지옥 난이도 활성화."); }
      else { showToast("[SYSTEM] 일반 난이도 시작."); }

      isGameStarted = true; gameState = 'BUNKER'; 
      if (mode === 'MOBILE') document.getElementById('mobile-controls').style.display = 'block'; else document.body.requestPointerLock();
      buildInitialWorld(); updateHandModel();
      
      setInterval(() => {
        if (!isGameStarted || gameState === 'ENDING' || gameState === 'START') return;
        
        realTimeSeconds++; inGameTimeSeconds += 15; 
        
        if (isHardMode) {
            if (!player.isMoving && Date.now() - player.lastDamageTime > 1000 && player.hp < player.maxHp) { player.hp = Math.min(player.maxHp, player.hp + 5); updateHUD(); }
        } else {
            if (Date.now() - player.lastDamageTime > 3000 && player.hp < player.maxHp) { player.hp = Math.min(player.maxHp, player.hp + 2); updateHUD(); }
        }
        
        const startTotalSecs = (15 * 3600) + (30 * 60) + inGameTimeSeconds;
        const h = Math.floor(startTotalSecs / 3600) % 24; const m = Math.floor(startTotalSecs / 60) % 60; const s = startTotalSecs % 60;
        document.getElementById('time-display').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        
        if (gameState === 'BUNKER' && realTimeSeconds === BOSS_START_TIME - 10) { 
          gameState = 'FINAL_WAVE'; showToast("[SYSTEM] 최후의 방어선 붕괴! 벙커 탈출 준비!"); 
          document.getElementById('status-display').innerText = "🚨 벙커 붕괴 임박"; document.getElementById('status-display').style.color = "#e74c3c";
        }
        if (gameState === 'FINAL_WAVE' && realTimeSeconds < BOSS_START_TIME) {
          let rushCount = isHardMode ? 10 : 3;
          for(let i=0; i<rushCount; i++) { const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)]; spawnEnemy(sp.x + (Math.random()-0.5)*4, sp.z + (Math.random()-0.5)*4); }
        }
        if (gameState === 'FINAL_WAVE' && realTimeSeconds === BOSS_START_TIME) { triggerFinalBombing(); }
        
        if (gameState === 'BUNKER') {
          if (realTimeSeconds >= 15 && (nextEnemySpawnTime === -1 || realTimeSeconds >= nextEnemySpawnTime)) {
            let spawnCount = isHardMode ? (Math.floor(Math.random() * 10) + 5) : (Math.floor(Math.random() * 5) + 2); 
            for(let i=0; i<spawnCount; i++) { const sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)]; spawnEnemy(sp.x + (Math.random()-0.5)*4, sp.z + (Math.random()-0.5)*4); }
            nextEnemySpawnTime = realTimeSeconds + (isHardMode ? Math.floor(Math.random() * 3) + 2 : Math.floor(Math.random() * 6) + 5); 
          }
          
          const shouldAirRaid = isHardMode ? (realTimeSeconds >= 10 && realTimeSeconds % 5 === 0) : (realTimeSeconds >= nextAirRaidTime);
          
          if (shouldAirRaid) {
            isAirRaidActive = true; showToast("[AIR RAID] 연쇄 융단 폭격 경보!"); 
            const bombCount = isHardMode ? 30 : (Math.floor(Math.random() * 8) + 3); 
            const bombInterval = isHardMode ? 100 : 600;

            for(let bIdx = 0; bIdx < bombCount; bIdx++) {
              setTimeout(() => {
                if (gameState === 'ENDING') return;
                const cx = Math.floor((Math.random()-0.5)*(MAP_SIZE - 4)); const cz = Math.floor((Math.random()-0.5)*(MAP_SIZE - 4));
                let hitY = 4; while(hitY >= MIN_DIG_Y && !isSolid(cx, hitY, cz)) hitY--;
                let digPower = isHardMode ? 5 : 3; let bottomY = hitY - digPower;
                
                if (!isHardMode) bottomY = Math.max(-6, bottomY); else bottomY = Math.max(MIN_DIG_Y, bottomY);

                sfx.explosion(); camera.position.x += (Math.random()-0.5)*0.6; camera.position.z += (Math.random()-0.5)*0.6;
                const expl = new THREE.Mesh(explGeo, new THREE.MeshBasicMaterial({color: 0xff4400, transparent: true, opacity: 0.9}));
                expl.position.set(cx, Math.max(hitY, MIN_DIG_Y), cz); scene.add(expl);
                let scale = 1; const explAnim = setInterval(() => {
                  scale += 0.2; expl.scale.set(scale, scale, scale); expl.material.opacity -= 0.15;
                  if (expl.material.opacity <= 0) { clearInterval(explAnim); scene.remove(expl); expl.material.dispose(); }
                }, 50);
                
                isBatching = true;
                for(let dx=-1; dx<=1; dx++) for(let dz=-1; dz<=1; dz++) for(let y=hitY+2; y>=bottomY; y--) removeVoxel(cx+dx, y, cz+dz, true); 
                isBatching = false;
                dirtyVoxels.forEach(key => { const parts = key.split(','); updateVoxelMesh(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2])); }); dirtyVoxels.clear();
                
                if (player.pos.y >= bottomY - 1 && player.pos.y <= hitY + 3 && Math.hypot(player.pos.x-cx, player.pos.z-cz) < 2.5) damagePlayer(25);
                for (let i = enemies.length - 1; i >= 0; i--) {
                  if (enemies[i].group.position.y >= bottomY - 1 && enemies[i].group.position.y <= hitY + 3 && Math.hypot(enemies[i].group.position.x - cx, enemies[i].group.position.z - cz) < 2.5) {
                    enemyGroup.remove(enemies[i].group); enemies.splice(i, 1);
                  }
                }
              }, bIdx * bombInterval); 
            }
            setTimeout(() => { isAirRaidActive = false; }, bombCount * bombInterval + 1000);
            if (!isHardMode) nextAirRaidTime = realTimeSeconds + Math.floor(Math.random() * 21) + 15;
          }
        }
      }, 1000);
    }
    
    function triggerFinalBombing() {
      gameState = 'TRANSITION'; showToast("[SYSTEM] 벙커 붕괴! 탈출하라!"); document.getElementById('fade-screen').style.opacity = '1'; 
      for(let i=0; i<15; i++) { setTimeout(() => { sfx.explosion(); camera.position.y -= 0.5; }, i * 300); }
      setTimeout(() => {
        buildRuinsWorld(); player.pos.set(0, 1.5, 10); player.rotY = Math.PI; player.hp = player.maxHp; updateHUD(); forceFistMode();
        document.getElementById('fade-screen').style.opacity = '0'; gameState = 'BOSS'; spawnStalinBoss();
      }, 5000);
    }

    function triggerEnding(type) {
      if (gameState === 'ENDING') return;
      gameState = 'ENDING'; if (document.pointerLockElement) document.exitPointerLock();

      const modal = document.getElementById('ending-modal'); const title = document.getElementById('ending-title');
      const sub = document.getElementById('ending-subtitle'); const desc = document.getElementById('ending-desc');

      if (type === 'DEATH') {
        title.innerText = "K.I.A"; title.style.color = "#e74c3c"; sub.innerText = "사망 엔딩: 벙커의 무덤";
        desc.innerText = "벙커는 무너졌고, 제국은 끝났다. 당신은 역사의 먼지가 되었다.";
      } 
      else if (type === 'DEFEAT') {
        title.innerText = "EXECUTED"; title.style.color = "#e74c3c"; sub.innerText = "스탈린 엔딩: 처형";
        desc.innerText = "스탈린의 묵직한 철권에 쓰러졌다. 베를린은 완전히 그들의 차지가 되었다.";
      } 
      else if (type === 'VICTORY') {
        title.innerText = "SURVIVED"; title.style.color = "#e67e22"; sub.innerText = "진 엔딩: 고독한 승리자";
        desc.innerText = "스탈린을 쓰러뜨렸다. 총성도 폭격도 멈춘 정적 속에서, 당신은 폐허가 된 제국을 홀로 걸어나간다...";
        document.getElementById('fade-screen').style.background = "#fff"; document.getElementById('fade-screen').style.opacity = "1";
      } 
      else if (type === 'ARGENTINA') {
        title.innerText = "ESCAPED"; title.style.color = "#3498db"; sub.innerText = "히든 엔딩: 아르헨티나의 태양";
        desc.innerText = "끝없이 파고 내려간 끝에 비밀 터널을 찾아 남미로 도주했다. 세상은 당신이 죽은 줄 알 것이다.";
      }
      else if (type === 'ARTIST') {
        title.innerText = "PEACE"; title.style.color = "#2ecc71"; sub.innerText = "히든 엔딩: 예술가로의 귀환";
        desc.innerText = "낡은 캔버스를 보는 순간 모든 분노가 사라졌다. 당신이 붓을 쥐자 적들도 경탄하며 총을 거두었다.";
      }
      modal.style.display = 'flex'; setTimeout(() => modal.style.opacity = 1, 100);
    }
    
    // 파티클 루프 처리 (렉 방지용 전역 함수)
    function updateParticles() {
        for(let i=bloodParticles.length-1; i>=0; i--) {
            let p = bloodParticles[i];
            p.life -= 0.05;
            if(p.life <= 0) {
                scene.remove(p.points); p.geo.dispose(); p.mat.dispose(); bloodParticles.splice(i, 1);
            } else {
                const positions = p.points.geometry.attributes.position.array;
                for(let j=0; j<p.vels.length; j++) {
                    positions[j*3] += p.vels[j].x;
                    positions[j*3+1] += p.vels[j].y;
                    positions[j*3+2] += p.vels[j].z;
                    p.vels[j].y -= 0.01; 
                }
                p.points.geometry.attributes.position.needsUpdate = true;
                p.mat.opacity = p.life;
            }
        }
    }

    function animate() { 
        requestAnimationFrame(animate); 
        updatePlayer(); 
        updateEnemies(); 
        updateStalin(); 
        updateParticles(); 
        renderer.render(scene, camera); 
    }
    animate();
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  </script>
</body>
</html>
